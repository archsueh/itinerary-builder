<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小绿汁一日摩旅（示例）</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#e8e4dc;}
body{
  font-family:Inter,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  color:#16140f;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
.sheet{
  width:min(100vw, 430px);
  margin:0 auto;
  background:#f4f1ea;
  aspect-ratio:3/4;
  position:relative;
  box-shadow:0 1px 0 #e0ddd6;
}
@media print{
  html,body{background:#f4f1ea;}
  .sheet{width:100%;max-width:none;box-shadow:none;margin:0;}
}
.frame{
  position:absolute;inset:14px;
  border:2px solid #b8b3a6;
  pointer-events:none;
}
.frame::after{
  content:"";position:absolute;inset:8px;
  border:1px solid #b8b3a6;opacity:.7;
}
.inner{
  position:relative;
  z-index:1;
  height:100%;
  padding:36px 34px 28px;
  display:flex;flex-direction:column;
}
.head{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;margin-bottom:12px;
}
.kicker{
  font-size:11px;letter-spacing:.16em;color:#6f6a60;
  font-weight:600;text-transform:uppercase;
}
.endpoints{
  font-size:12px;letter-spacing:.08em;color:#16140f;
  font-weight:700;text-transform:uppercase;white-space:nowrap;
}
h1{
  font-size:36px;font-weight:800;letter-spacing:.02em;
  line-height:1.15;margin:0 0 8px;text-align:center;
}
h1 .hl{
  color:#e0362b;font-size:1.38em;font-weight:800;
  margin:0 .04em;font-variant-numeric:tabular-nums;
}
.sub{
  text-align:center;font-size:13.5px;color:#16140f;
  margin-bottom:10px;line-height:1.55;
}
.sub .hl{color:#e0362b;font-weight:700;font-variant-numeric:tabular-nums;}
.rule{
  height:4px;width:100%;margin:0 0 14px;
  background:linear-gradient(90deg,#e0362b 0 72%,#cfccc3 72% 100%);
}
.map{
  flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  margin:4px 0 12px;
}
.map svg.route{width:100%;height:auto;display:block;}
.slogan{
  text-align:center;font-size:13.5px;color:#16140f;
  line-height:1.65;margin:4px 0 10px;font-weight:500;
}
.slogan .hl{color:#e0362b;font-weight:700;}
.stats{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  border:1.5px solid #16140f;background:#ffffff;
  margin:0 0 10px;
}
.stat{
  padding:10px 6px 9px;text-align:center;
  border-right:1px solid #cfccc3;
}
.stat:last-child{border-right:none;}
.stat-v{
  font-size:18px;font-weight:800;color:#16140f;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.2;
}
.stat.accent .stat-v{color:#e0362b;}
.stat-l{
  margin-top:6px;font-size:11px;color:#6f6a60;line-height:1.4;
}
.tags{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  margin:0 0 10px;
}
.pill{
  display:inline-block;padding:5px 12px;
  border:1px solid #16140f;border-radius:999px;
  background:#ebe7dc;font-size:11.5px;color:#16140f;
  letter-spacing:.02em;line-height:1.3;
}
.foot{
  text-align:center;font-size:10.5px;color:#9a948a;line-height:1.55;
  margin-top:auto;padding-top:6px;
}</style>
</head>
<body>
<article class="sheet" data-poster="1">
  <div class="frame" aria-hidden="true"></div>
  <div class="inner">
    <header class="head">
      <div class="kicker">MOTO ROUTE · 昆明出发</div>
      <div class="endpoints">KUNMING → LVZHI</div>
    </header>
    <h1>骑进 <span class="hl">80</span> 年代</h1>
    <p class="sub">小绿汁 · <span class="hl">134km</span> 国道摩旅一日线</p>

ity="0.85"/><circle cx="165.6" cy="56.0" r="9" fill="#e0362b" stroke="#f4f1ea" stroke-width="2"/><line x1="165.6" y1="56.0" x2="201.6" y2="30.0" stroke="#cfccc3" stroke-width="1" stroke-dasharray="3 3"/><text x="201.6" y="34.0" text-anchor="start" font-family="Inter,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13"><tspan fill="#16140f" font-weight="600">昆明</tspan><tspan dx="5" fill="#e0362b" font-weight="700" font-variant-numeric="tabular-nums">0km</tspan></text><g transform="translate(143.6 78.0)" fill="#e0362b" stroke="none"><path d="M0 -2.1 C-6.3 -9.8 6.3 -9.8 0 -2.1 C4.9 0.7 0 7.7 0 7.7 C0 7.7 -4.9 0.7 0 -2.1 Z"/><circle cx="0" cy="-5.3" r="2.2" fill="#f4f1ea"/></g><circle cx="386.4" cy="123.2" r="7" fill="#f4f1ea" stroke="#e0362b" stroke-width="2.5"/><line x1="386.4" y1="123.2" x2="350.4" y2="145.2" stroke="#cfccc3" stroke-width="1" stroke-dasharray="3 3"/><text x="350.4" y="149.2" text-anchor="end" font-family="Inter,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13"><tspan fill="#16140f" font-weight="600">碧鸡关</tspan><tspan dx="5" fill="#e0362b" font-weight="700" font-variant-numeric="tabular-nums">22km</tspan></text><circle cx="257.6" cy="224.0" r="7" fill="#f4f1ea" stroke="#e0362b" stroke-width="2.5"/><line x1="257.6" y1="224.0" x2="293.6" y2="198.0" stroke="#cfccc3" stroke-width="1" stroke-dasharray="3 3"/><text x="293.6" y="202.0" text-anchor="start" font-family="Inter,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13"><tspan fill="#16140f" font-weight="600">草铺</tspan><tspan dx="5" fill="#e0362b" font-weight="700" font-variant-numeric="tabular-nums">38km</tspan></text><g transform="translate(235.6 246.0)" fill="none" stroke="#e0362b" stroke-width="1.6"><rect x="-4.9" y="-6.3" width="7.7" height="12.6" rx="1"/><path d="M3.5 -2.8 V4.9 H7.7 V-0.7"/><circle cx="7.7" cy="2.1" r="1.7"/></g><circle cx="506.0" cy="291.2" r="7" fill=     <p class="slogan">一条60年的铜矿公路<br>把整座<span class="hl">80年代小镇</span>留在了峡谷里</p>
    <div class="stats"><div class="stat"><div class="stat-v">134km</div><div class="stat-l">单程全程国道</div></div><div class="stat accent"><div class="stat-v">2h56m</div><div class="stat-l">去程骑行</div></div><div class="stat"><div class="stat-v">72拐</div><div class="stat-l">绿汁坡连续发卡弯</div></div></div>
